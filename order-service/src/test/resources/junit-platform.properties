# Cucumber Configuration
cucumber.publish.enabled=false
cucumber.publish.quiet=true

# Parallel Execution
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=dynamic
cucumber.execution.parallel.config.dynamic.factor=1

# Plugin Configuration
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json

# Glue Configuration
cucumber.glue=com.microservices.order.test

# Feature Configuration
cucumber.features=classpath:features
